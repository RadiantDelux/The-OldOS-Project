name: Build OldOS unsigned IPA

on:
  push:
    branches:
      - master
      - feature/classic-external-app-launcher
  pull_request:
    paths:
      - 'OldOS/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oldos-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS device build / unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PROJECT: OldOS/OldOS.xcodeproj
      SCHEME: OldOS
      DERIVED_DATA: ${{ runner.temp }}/OldOSDerivedData
      PACKAGE_CACHE: ${{ runner.temp }}/OldOSPackages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Inspect scheme and toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"
          test -f "OldOS/OldOS.xcodeproj/xcshareddata/xcschemes/OldOS.xcscheme"

      - name: Resolve Swift package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE"

      - name: Build for a physical iOS device (no signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/oldos-build.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$DERIVED_DATA/Build/Products/Release-iphoneos/OldOS.app"
          test -f "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/OldOSPayload/Payload"
          ditto "$app" "$RUNNER_TEMP/OldOSPayload/Payload/OldOS.app"
          (
            cd "$RUNNER_TEMP/OldOSPayload"
            zip -q -r "$GITHUB_WORKSPACE/OldOS-unsigned.ipa" Payload
          )
          unzip -t "$GITHUB_WORKSPACE/OldOS-unsigned.ipa" | tail -n 1
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          shasum -a 256 "$GITHUB_WORKSPACE/OldOS-unsigned.ipa" > "$GITHUB_WORKSPACE/OldOS-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OldOS-iOS-unsigned-IPA
          path: |
            OldOS-unsigned.ipa
            OldOS-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: OldOS-build-diagnostics
          path: ${{ runner.temp }}/oldos-build.log
          if-no-files-found: warn
          retention-days: 7
